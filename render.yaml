# ============================================================================
# Trinetra Pulse — Render Blueprint (Phase 14.3 + 17.10)
# ----------------------------------------------------------------------------
# Production target: Render native runtimes. NO Docker is required.
#
#   Frontend -> Next.js native Node Web Service (apps/web)
#   Backend  -> FastAPI native Python Web Service  (apps/api)
#   Database -> Render Managed PostgreSQL
#
# Render runs the build/start/pre-deploy commands below. Secrets are injected
# at sync time or from the managed database; never commit real credentials.
# Schema migrations run automatically on every deploy (preDeployCommand).
# See docs/RENDER_DEPLOYMENT.md for the full setup + first-deploy steps.
# ============================================================================

# Resource names (keep wiring references below in sync):
#   db      : trinetra-pulse-db
#   api     : trinetra-pulse-api
#   web     : trinetra-pulse-web

services:
  # --------------------------------------------------------------------------
  # Backend — FastAPI (native Python runtime)
  # --------------------------------------------------------------------------
  - type: web
    name: trinetra-pulse-api
    runtime: python
    rootDir: apps/api
    region: oregon
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # Runs on every deploy BEFORE the new service version starts (and fails the
    # deploy on error). Keeps the managed PostgreSQL schema current; the
    # operation merge of Operation Meridian demo data is a documented one-off
    # post-deploy step (python -m app.db.seed in the apps/api root) so a
    # deployment that should start empty is never auto-seeded.
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: trinetra-pulse-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      # Phase 18.1 — JWT signing secret for the auth layer. Crash-consistent
      # across syncs so issued tokens survive redeploys. In APP_ENV=production
      # the API refuses to start with its development default. Demo accounts
      # (investigator/supervisor/admin/auditor @trinetra.dev) are seeded only
      # by running `python -m app.db.seed` in apps/api.
      - key: JWT_SECRET_KEY
        generateValue: true
      # The deployed Render frontend origin. Set to the onrender.com (or custom)
      # URL of the web service after its first deploy.
      - key: FRONTEND_URL
        sync: false
      - key: EVIDENCE_STORAGE_PROVIDER
        value: s3
      - key: EVIDENCE_STORAGE_BUCKET
        sync: false
      - key: EVIDENCE_STORAGE_REGION
        sync: false
      - key: EVIDENCE_STORAGE_ENDPOINT
        sync: false
      - key: EVIDENCE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: EVIDENCE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: EVIDENCE_STORAGE_PREFIX
        value: evidence
      - key: EVIDENCE_MAX_UPLOAD_BYTES
        value: "209715200"
      - key: AI_PROVIDER
        value: mock
      # Conservative pool for Render free-tier PostgreSQL connection limits.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - render.yaml

  # --------------------------------------------------------------------------
  # Frontend — Next.js (native Node runtime)
  # --------------------------------------------------------------------------
  - type: web
    name: trinetra-pulse-web
    runtime: node
    region: oregon
    plan: free
    healthCheckPath: /overview
    # npm workspaces: install + build from the repo root so the shared
    # packages/* and root package-lock.json are resolved, then run the app's
    # own `next build` / `next start` scripts with the workspace scoping.
    buildCommand: npm install && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      # Production must use the relational API, not in-memory mocks.
      - key: NEXT_PUBLIC_USE_MOCK_API
        value: "false"
      # Absolute URL of the deployed API (browser must reach it, so set the
      # public onrender.com URL of trinetra-pulse-api here at sync time).
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
    buildFilter:
      paths:
        - apps/web/**
        - packages/types/**
        - packages/ui/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - render.yaml

databases:
  - name: trinetra-pulse-db
    plan: free
    region: oregon
    databaseName: trinetra
